<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ameer Riyaz, Senior Project Engineer, DevOps and Platform Engineering" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f3a"/>
      <stop offset="0.55" stop-color="#14183f"/>
      <stop offset="1" stop-color="#0c2250"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7B42BC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B42BC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#326CE5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    .t1 { animation: show .4s ease-out .4s both; }
    .t2 { animation: show .4s ease-out 1.0s both; }
    .t3 { animation: show .4s ease-out 1.6s both; }
    .t4 { animation: show .4s ease-out 2.2s both; }
    .t5 { animation: show .4s ease-out 2.8s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
    <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>
  </g>

  <!-- Left: identity -->
  <text x="60" y="120" class="sans" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="2">AMEER RIYAZ</text>
  <text x="62" y="170" class="sans" font-size="28" font-weight="600" fill="#ffffff">Senior Project Engineer</text>
  <text x="62" y="205" class="sans" font-size="18" fill="#c4b5fd">DevOps · Platform Engineering · Infrastructure as Code</text>

  <g class="sans" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="62" y="236" width="104" height="32" rx="16" fill="#7B42BC"/>
    <text x="114" y="257" fill="#ffffff">Terraform</text>
    <rect x="176" y="236" width="112" height="32" rx="16" fill="#326CE5"/>
    <text x="232" y="257" fill="#ffffff">Kubernetes</text>
    <rect x="298" y="236" width="64" height="32" rx="16" fill="#232F3E" stroke="#FF9900" stroke-opacity="0.8"/>
    <text x="330" y="257" fill="#ffffff">AWS</text>
    <rect x="372" y="236" width="92" height="32" rx="16" fill="#C21325"/>
    <text x="418" y="257" fill="#ffffff">Ansible</text>
    <rect x="474" y="236" width="96" height="32" rx="16" fill="#E8590C"/>
    <text x="522" y="257" fill="#ffffff">Argo CD</text>
  </g>

  <!-- Right: terminal -->
  <g>
    <rect x="680" y="46" width="470" height="228" rx="12" fill="#0b1020" fill-opacity="0.92" stroke="#7B42BC" stroke-opacity="0.7"/>
    <rect x="680" y="46" width="470" height="34" rx="12" fill="#1a1f36"/>
    <rect x="680" y="68" width="470" height="12" fill="#1a1f36"/>
    <circle cx="704" cy="63" r="6" fill="#ff5f56"/>
    <circle cx="726" cy="63" r="6" fill="#ffbd2e"/>
    <circle cx="748" cy="63" r="6" fill="#27c93f"/>
    <text x="915" y="68" class="mono" font-size="13" fill="#8b93b5" text-anchor="middle">ameer@infra: ~</text>

    <g class="mono" font-size="16">
      <text x="702" y="115" class="t1"><tspan fill="#a78bfa">$</tspan><tspan fill="#e5e7eb"> terraform apply -auto-approve</tspan></text>
      <text x="702" y="145" class="t2" fill="#4ade80">✓ Apply complete</text>
      <text x="702" y="180" class="t3"><tspan fill="#a78bfa">$</tspan><tspan fill="#e5e7eb"> kubectl get nodes</tspan></text>
      <text x="702" y="210" class="t4" fill="#4ade80">✓ All nodes Ready</text>
      <text x="702" y="245" class="t5"><tspan fill="#a78bfa">$</tspan><tspan fill="#e5e7eb"> argocd app sync production </tspan><tspan class="cursor" fill="#a78bfa">█</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
