<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Delivery pipeline: Code to GitLab CI or Jenkins to Docker to Helm to Argo CD to Kubernetes, with Terraform and Ansible provisioning and Prometheus and Grafana monitoring" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f3a"/>
      <stop offset="1" stop-color="#0c2250"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .sub { font-size: 12px; fill: #c4b5fd; text-anchor: middle; }
    @keyframes pulse { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    .node { animation: pulse 3s ease-in-out infinite; }
    .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; }
    .n4 { animation-delay: 1.5s; } .n5 { animation-delay: 2s; } .n6 { animation-delay: 2.5s; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .flow { stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
  </g>

  <text x="600" y="38" class="sans" font-size="20" font-weight="700" fill="url(#line)" text-anchor="middle" letter-spacing="3">DELIVERY PIPELINE</text>

  <!-- main flow line -->
  <line x1="150" y1="130" x2="1050" y2="130" stroke="url(#line)" stroke-width="3" class="flow"/>

  <!-- nodes -->
  <g class="sans">
    <rect x="40" y="95" width="150" height="70" rx="14" fill="#14183f" stroke="#a78bfa" stroke-width="2" class="node"/>
    <text x="115" y="125" class="title">Code</text>
    <text x="115" y="146" class="sub">Git</text>

    <rect x="225" y="95" width="150" height="70" rx="14" fill="#14183f" stroke="#fb923c" stroke-width="2" class="node n2"/>
    <text x="300" y="125" class="title">CI</text>
    <text x="300" y="146" class="sub">GitLab CI / Jenkins</text>

    <rect x="410" y="95" width="150" height="70" rx="14" fill="#14183f" stroke="#38bdf8" stroke-width="2" class="node n3"/>
    <text x="485" y="125" class="title">Build</text>
    <text x="485" y="146" class="sub">Docker image</text>

    <rect x="595" y="95" width="150" height="70" rx="14" fill="#14183f" stroke="#818cf8" stroke-width="2" class="node n4"/>
    <text x="670" y="125" class="title">Package</text>
    <text x="670" y="146" class="sub">Helm chart</text>

    <rect x="780" y="95" width="150" height="70" rx="14" fill="#14183f" stroke="#f97316" stroke-width="2" class="node n5"/>
    <text x="855" y="125" class="title">Deploy</text>
    <text x="855" y="146" class="sub">Argo CD (GitOps)</text>

    <rect x="965" y="95" width="195" height="70" rx="14" fill="#14183f" stroke="#326CE5" stroke-width="2" class="node n6"/>
    <text x="1062" y="125" class="title">Run</text>
    <text x="1062" y="146" class="sub">Kubernetes (HA or standard)</text>
  </g>

  <!-- moving packets -->
  <g filter="url(#glow)">
    <circle r="7" fill="#a78bfa">
      <animateMotion dur="5s" repeatCount="indefinite" path="M150,130 L1050,130"/>
    </circle>
    <circle r="7" fill="#60a5fa">
      <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M150,130 L1050,130"/>
    </circle>
    <circle r="7" fill="#f97316">
      <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M150,130 L1050,130"/>
    </circle>
  </g>

  <!-- infra and monitoring lanes -->
  <g class="sans">
    <rect x="150" y="215" width="400" height="52" rx="12" fill="#7B42BC" fill-opacity="0.25" stroke="#7B42BC" stroke-width="1.5"/>
    <text x="350" y="237" class="title" font-size="15">Terraform + Ansible</text>
    <text x="350" y="256" class="sub">provision and configure AWS / on-premise</text>
    <path d="M350,215 L350,168 M670,215 L670,168" stroke="#7B42BC" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0"/>

    <rect x="650" y="215" width="400" height="52" rx="12" fill="#326CE5" fill-opacity="0.25" stroke="#326CE5" stroke-width="1.5"/>
    <text x="850" y="237" class="title" font-size="15">Prometheus + Grafana</text>
    <text x="850" y="256" class="sub">monitor clusters and applications</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
